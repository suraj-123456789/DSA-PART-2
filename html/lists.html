<!DOCTYPE html>
<html lang="en">
<head>
    <title>LISTS</title>
</head>
<body>
    <h1>Types Of List</h1>
    <h3>There are two types of list</h3>
    <P>1. ordered list </P>
    <ol>
        <li>HTML</li>
        <li>CSS</li>
        <li>JAVA SCRIPT</li>
    </ol>
    <p>2. unordered list</p>
    <ul>
        <li>HTML</li>
        <li>CSS</li>
        <li>JAVA SCRIPT</li>
    </ul>
    <p>3. discription list</p>
    <dl>
        <li>HTML</li>
        <li>CSS</li>
        <li>JAVA SCRIPT</li>
    </dl>
    <p>ordered list with "type" function</p>
    <ol type="I">
        <li>HTML</li>
        <li>CSS</li>
        <li>JAVA SCRIPT</li>
    </ol>
</body>
</html>
