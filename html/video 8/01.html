<!DOCTYPE html>
<html>

<head>
    <title>Inline vs Block</title>
</head>

<body>

    <h1>Block Elements</h1>

    <p style="background: red;">This is paragraph one.</p>
    <p>This is paragraph two.</p>

    <div>This is a div element.</div>

    <hr>

    <h1>Inline Elements</h1>

    <p>
        This is <b>bold</b>, <i>italic</i>, and <span style="background-color: blue; color:azure">span text</span>.
    </p>

    <p>
        Visit <a href="#">this link</a> and see this image
        <img src="https://via.placeholder.com/50">
    </p>

</body>

</html>
