<!DOCTYPE html>
<html>

<head>
    <title>Media + SVG + iframe</title>
</head>

<body>
    <!-- video making -->
    <video height="600" controls>
        <source src="shankar.mp4" type="video/mp4">
        <source src="shankar.mp4" type="video/mp4">
    </video>

    <!-- audio making -->
    <audio controls>
        <source src="fahh.mp3" type="audio/mp3">
    </audio>

    <!-- iframe making -->
    <iframe width="560" height="315" src="https://www.youtube.com/embed/XZwBNDGuWGU?si=Ad9ujfe8zOaslA5p"
        title="YouTube video player" frameborder="0"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        referrerpolicy="strict-origin-when-cross-origin" allowfullscreen>
    </iframe>

</body>

</html>
